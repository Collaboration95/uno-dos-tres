<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000" />
  <title>Uno cam</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    video { object-fit: contain; }
    #hud { position: fixed; left: env(safe-area-inset-left, 0); top: env(safe-area-inset-top, 0); margin: 6px; padding: 4px 8px; background: #000a; border-radius: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
    #banner { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0) + 12px); padding: 14px 12px; border-radius: 14px; text-align: center; font-weight: 800; font-size: clamp(22px, 7vw, 44px); background: #222d; color: #fff; transition: opacity .4s; pointer-events: none; }
    #now { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0) + 96px); padding: 10px; border-radius: 12px; text-align: center; font-weight: 800; font-size: clamp(28px, 10vw, 56px); background: #111c; pointer-events: none; }
    #now:empty { display: none; }
    #banner:empty { display: none; }
    #banner.stale { opacity: .45; }
    #msg { position: fixed; left: 8px; right: 8px; top: 50%; transform: translateY(-50%); text-align: center; font-size: 16px; padding: 12px; background: #000c; border-radius: 10px; }
    #msg:empty { display: none; }
    #msg.warn { top: auto; bottom: 35%; transform: none; background: #7a1d1dd9; }
    #start { position: fixed; inset: 0; margin: auto; width: 220px; height: 220px; border-radius: 50%; border: 0; font-size: 28px; font-weight: 800; color: #fff; background: #d72600; }
  </style>
</head>
<body>
  <video id="v" muted playsinline autoplay></video>
  <canvas id="o"></canvas>
  <div id="hud"></div>
  <div id="now"></div>
  <div id="banner"></div>
  <div id="msg"></div>
  <button id="start">START</button>
  <script type="module" src="/src/cam/main.ts"></script>
</body>
</html>
